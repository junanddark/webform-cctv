<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV REPORT 1 DVR - LEBAK</title>
    <style>
        :root { 
            --primary: #007bff; 
            --primary-dark: #0056b3;
            --success: #28a745; 
            --bg: #f4f7f9;
            --text: #333;
            --border: #dcdfe6;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 15px; 
            margin: 0; 
            line-height: 1.5;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2); 
            max-width: 650px; 
            margin: auto; 
        }

        h2 { 
            text-align: center; 
            color: #1a1a1a; 
            margin-top: 0; 
            font-size: 20px; 
            border-bottom: 2px solid var(--bg); 
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .section-title { 
            background: #f8f9fa; 
            padding: 8px 12px; 
            font-size: 11px; 
            font-weight: 800; 
            margin: 20px 0 15px 0; 
            border-radius: 6px; 
            color: #6c757d; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--primary);
        }

        .form-group { margin-bottom: 15px; }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 12px; 
            color: #495057; 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background: #fff; 
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #2c3e50;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* Responsive Grid System */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* Mobile View Fix */
        @media (max-width: 500px) {
            .grid, .grid-3 {
                grid-template-columns: 1fr;
            }
            .card { padding: 15px; }
        }

        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.2s;
        }

        .btn-gen { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        .btn-gen:hover { background: var(--primary-dark); }
        .btn-gen:active { transform: translateY(1px); }

        .btn-copy { 
            background: var(--success); 
            color: white; 
            display: none; 
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        #hasilLaporan { 
            margin-top: 20px; 
            white-space: pre-wrap; 
            background: #fffdf0; 
            padding: 15px; 
            border: 1px solid #ffeeba; 
            border-radius: 10px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            display: none; 
            color: #333; 
            line-height: 1.4;
        }

        textarea { resize: vertical; min-height: 60px; }
        input[readonly] { background: #f1f3f5 !important; color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 CCTV REPORT GENERATOR (1 DVR)</h2>
    
    <div class="form-group">
        <label>TANGGAL KUNJUNGAN</label>
        <input type="date" id="tglCustom">
    </div>

    <div class="grid">
        <div class="form-group">
            <label>KDTK</label>
            <input list="daftarToko" id="kdtk" oninput="isiOtomatis()" placeholder="Cari Kode Toko...">
            <datalist id="daftarToko"></datalist>
        </div>
        <div class="form-group">
            <label>NAMA TK</label>
            <input type="text" id="namaTk" readonly>
        </div>
    </div>

    <div class="section-title">KONFIGURASI DVR</div>
    <div class="grid">
        <div class="form-group">
            <label>TIPE DVR</label>
            <select id="tipeDvr">
                <option value="DAHUA TECHNOLOGY">DAHUA</option>
                <option value="GO SECURE">GO SECURE</option>
                <option value="HIKVISION">HIKVISION</option>
            </select>
        </div>
        <div class="form-group">
            <label>POSISI DVR</label>
            <select id="posisiDvr">
                <option value="DI GUDANG">DI GUDANG</option>
                <option value="DI BELAKANG SHOWCASE">DI BALIK SHOWCASE</option>
            </select>
        </div>
    </div>
    <div class="grid">
        <div class="form-group">
            <label>POSISI CAM PARKIR</label>
            <select id="posisiCamParkir">
                <option value="DIDALAM FG">DIDALAM FG</option>
                <option value="DILUAR FG">DILUAR FG</option>
                <option value="DIDALAM & DILUAR FG">DIDALAM & DILUAR FG</option>
            </select>
        </div>
        <div class="form-group">
            <label>JML CAM PARKIR</label>
            <input type="number" id="jmlCamParkir" placeholder="2">
        </div>
    </div>

    <div class="section-title">REKAMAN & KAMERA</div>
    <div class="grid-3">
        <div class="form-group">
            <label>LAMA REKAMAN</label>
            <select id="lamaRekaman"></select>
        </div>
        <div class="form-group">
            <label>TOTAL KAMERA</label>
            <select id="jmlKamera" onchange="hitungMati()"></select>
        </div>
        <div class="form-group">
            <label>JML SLOT KAMERA</label>
            <select id="sltKamera">
                <option value="8 SLOT">8 SLOT</option>
                <option value="16 SLOT" selected>16 SLOT</option>
                <option value="20 SLOT">20 SLOT</option>
                <option value="24 SLOT">24 SLOT</option>
                <option value="32 SLOT">32 SLOT</option>
                <option value="48 SLOT">48 SLOT</option>
            </select>
        </div>
    </div>
    <div class="grid-3">
        <div class="form-group">
            <label>KAMERA AKTIF</label>
            <select id="camAktif" onchange="hitungMati()"></select>
        </div>
        <div class="form-group">
            <label>KAMERA MATI</label>
            <input type="text" id="camMati" readonly>
        </div>
        <div class="form-group">
            <label>KAMERA AUDIO</label>
            <select id="camAudio">
                <option value="BAP">BAP</option>
                <option value="BAP1-KASIRAN2">BAP-KASIRAN-BRANGKAS</option>
                <option value="BAP-KASIRAN-BRANGKAS-YCG">BAP-KASIRAN-BRANGKAS-YCG</option>
                <option value="BAP-KASIRAN-BRANGKAS-PC">BAP-KASIRAN-BRANGKAS-PC</option>
            </select>
        </div>
    </div>

    <div class="section-title">HARDWARE STATUS</div>
    <div class="grid">
        <div class="form-group">
            <label>MONITOR</label>
            <select id="valMonitor">
                <option value="ADA / MENYALA">ADA / MENYALA</option>
                <option value="ADA / TIDAK MENYALA">ADA / TIDAK MENYALA</option>
                <option value="TIDAK ADA">TIDAK ADA</option>
            </select>
        </div>
        <div class="form-group">
            <label>KRANGKENG</label>
            <select id="valKrangkeng">
                <option value="ADA / DIKUNCI">ADA / DIKUNCI</option>
                <option value="ADA / TIDAK DIKUNCI">ADA / TIDAK DIKUNCI</option>
                <option value="TIDAK ADA">TIDAK ADA</option>
            </select>
        </div>
    </div>
    <div class="grid-3">
        <div class="form-group">
            <label>GEMBOK</label>
            <select id="valGembok">
                <option value="TIDAK ADA">TIDAK ADA</option>
                <option value="ADA / MENGUNCI">ADA / MENGUNCI</option>
            </select>
        </div>
        <div class="form-group">
            <label>KUNCI TERSEDIA</label>
            <select id="valKunci">
                <option value="TIDAK ADA">TIDAK ADA</option>
                <option value="1 PCS">1 PCS</option>
                <option value="2 PCS">2 PCS</option>
                <option value="3 PCS">3 PCS</option>
            </select>
        </div>
        <div class="form-group">
            <label>UPS</label>
            <select id="valUps">
                <option value="ADA / MENYALA">ADA / MENYALA</option>
                <option value="ADA / TIDAK MENYALA">ADA / TIDAK MENYALA</option>
                <option value="TIDAK ADA">TIDAK ADA</option>
            </select>
        </div>
    </div>
    <div class="grid-3">
        <div class="form-group">
            <label>STABILIZER</label>
            <select id="valStabilizer">
                <option value="ADA / MENYALA">ADA / MENYALA</option>
                <option value="ADA / TIDAK MENYALA">ADA / TIDAK MENYALA</option>
                <option value="TIDAK ADA">TIDAK ADA</option>
            </select>
        </div>
        <div class="form-group">
            <label>RESOLUSI</label>
            <select id="resolusiRekaman">
                <option value="1280*1024">1280*1024</option>
                <option value="960*576">960*576</option>
            </select>
        </div>
        <div class="form-group">
            <label>FPS</label>
            <select id="fps">
                <option value="25 FPS">25 FPS</option>
                <option value="15 FPS" selected>15 FPS</option>
            </select>
        </div>
    </div>

    <div class="section-title">STORAGE & ONLINE</div>
    <div class="grid">
        <div class="form-group">
            <label>HDD DVR</label>
            <select id="hddDvr">
                <option value="1 TB">1 TB</option>
                <option value="2 TB" selected>2 TB</option>
                <option value="3 TB">3 TB</option>
                <option value="4 TB">4 TB</option>
            </select>
        </div>
        <div class="form-group">
            <label>CCTV ONLINE</label>
            <input type="text" id="cctvOnline" value="TIDAK DAPAT DICEK">
        </div>
    </div>

    <div class="section-title">WAKTU & BACKUP</div>
    <div class="form-group">
        <label>SELISIH WAKTU</label>
        <input type="text" id="selisih" value="- (DISESUAIKAN)">
    </div>
    <div class="form-group">
        <label>TGL & JAM BACK UP</label>
        <textarea id="backTgl" placeholder="Contoh: 20/04/2026 JAM 06:38 - 06:40"></textarea>
    </div>
    <div class="form-group">
        <label>CHANEL BACK UP</label>
        <input type="text" id="chanel" value="3.4.9">
    </div>

    <div class="section-title">TEMUAN & LAINNYA</div>
    <div class="grid">
        <div class="form-group">
            <label>TEMUAN</label>
            <textarea id="temuan">-</textarea>
        </div>
        <div class="form-group">
            <label>KENDALA</label>
            <textarea id="kendala">-</textarea>
        </div>
    </div>
    <div class="grid">
        <div class="form-group">
            <label>NO CO</label>
            <input type="text" id="noco" value="-">
        </div>
        <div class="form-group">
            <label>NOTE</label>
            <textarea id="valNote">-</textarea>
        </div>
    </div>

    <button class="btn-gen" onclick="prosesLaporan()">BUAT LAPORAN</button>
    
    <div id="hasilLaporan"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyTeks()">📋 SALIN LAPORAN</button>
</div>

<script src="data-toko.js"></script>

<script>
    // 1. Inisialisasi Data Toko
    const dataList = document.getElementById('daftarToko');
    if (typeof listToko !== 'undefined') {
        listToko.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t.kode;
            opt.textContent = t.nama;
            dataList.appendChild(opt);
        });
    }

    document.getElementById('tglCustom').valueAsDate = new Date();

    function generateOptions() {
        const selLama = document.getElementById('lamaRekaman');
        for(let i=1; i<=150; i++) {
            let opt = document.createElement('option');
            opt.value = i + " HARI";
            opt.textContent = i + " HARI";
            if(i === 20) opt.selected = true;
            selLama.appendChild(opt);
        }

        const jmlKamera = document.getElementById('jmlKamera');
        const camAktif = document.getElementById('camAktif');
        const jumlahMax = 32; // Saya naikkan ke 32 biar fleksibel

        for (let i = 1; i <= jumlahMax; i++) {
            let opt1 = document.createElement("option");
            opt1.value = i + " KAMERA";
            opt1.textContent = i + " KAMERA";
            if(i === 16) opt1.selected = true;
            jmlKamera.appendChild(opt1);

            let opt2 = document.createElement("option");
            opt2.value = i + " KAMERA";
            opt2.textContent = i + " KAMERA";
            if(i === 16) opt2.selected = true;
            camAktif.appendChild(opt2);
        }
    }

    generateOptions();

    function isiOtomatis() {
        const val = document.getElementById('kdtk').value.toUpperCase();
        if (typeof listToko !== 'undefined') {
            const found = listToko.find(t => t.kode === val);
            document.getElementById('namaTk').value = found ? found.nama : "";
        }
        hitungMati();
    }

    function hitungMati() {
        const total = parseInt(document.getElementById('jmlKamera').value) || 0;
        const aktif = parseInt(document.getElementById('camAktif').value) || 0;
        document.getElementById('camMati').value = (total - aktif) + " KAMERA";
    }

    hitungMati();

    function prosesLaporan() {
        const kdtk = document.getElementById('kdtk').value.toUpperCase();
        const namaTk = document.getElementById('namaTk').value;
        const d = new Date(document.getElementById('tglCustom').value);
        if(!kdtk || !namaTk) return alert("Pilih KDTK!");

        const tglFinal = d.toLocaleDateString('id-ID', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase();

        const template = `LAPORAN KUNJUNGAN CCTV, ${tglFinal}

KDTK : ${kdtk}
NAMA TK : ${namaTk}
TIPE DVR : ${document.getElementById('tipeDvr').value}
POSISI DVR : ${document.getElementById('posisiDvr').value}
POSISI.CAM.PARKIR : ${document.getElementById('jmlCamParkir').value} (${document.getElementById('posisiCamParkir').value})
PASS ADMIN : - G157${kdtk}911
PASS IC : - LEBAK1234
PASS EDP : - EDP${kdtk}999
PASS ACL : - ACLLBK123
PASS AREA : - ${kdtk}4321
LAMA REKAMAN : ${document.getElementById('lamaRekaman').value}
JUMLAH KAMERA : ${document.getElementById('jmlKamera').value} 
SLOT KAMERA : ${document.getElementById('sltKamera').value} 
KAMERA AKTIF : ${document.getElementById('camAktif').value} 
KAMERA MATI : ${document.getElementById('camMati').value}
KAMERA AUDIO : ${document.getElementById('camAudio').value}
MONITOR : ${document.getElementById('valMonitor').value}
KRANGKENG : ${document.getElementById('valKrangkeng').value}
GEMBOK : ${document.getElementById('valGembok').value}
KUNCI GEMBOK TERSEDIA : ${document.getElementById('valKunci').value}
UPS : ${document.getElementById('valUps').value}
STABILIZER : ${document.getElementById('valStabilizer').value}
HDD DVR : ${document.getElementById('hddDvr').value}
RESOLUSI DVR : ${document.getElementById('resolusiRekaman').value}
FPS : ${document.getElementById('fps').value}
CCTV ONLINE : ${document.getElementById('cctvOnline').value}
SELISIH WAKTU : ${document.getElementById('selisih').value}
TGL & JAM BACK UP :
${document.getElementById('backTgl').value}
CHANEL BACK UP : ${document.getElementById('chanel').value}
TEMUAN : ${document.getElementById('temuan').value}
KENDALA : ${document.getElementById('kendala').value}
NO CO : ${document.getElementById('noco').value}
NOTE : ${document.getElementById('valNote').value}`;

        const res = document.getElementById('hasilLaporan');
        res.innerText = template;
        res.style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        res.scrollIntoView({ behavior: 'smooth' });
    }

    function copyTeks() {
        navigator.clipboard.writeText(document.getElementById('hasilLaporan').innerText);
        alert("Laporan disalin!");
    }
</script>

</body>
</html>
